apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: "ladder"
            - name: POSTGRES_PASSWORD
              value: "ladderpassword"
            - name: POSTGRES_DB
              value: "ladder"
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: elo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: elo-app
  template:
    metadata:
      labels:
        app: elo-app
    spec:
      imagePullSecrets:
        - name: dockerhub
      containers:
        - name: elo-app
          image: DOCKERHUB_USER_PLACEHOLDER/elo-ladder:IMAGE_TAG_PLACEHOLDER
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: DATABASE_URL
              value: "jdbc:postgresql://postgres:5432/ladder"
            - name: DB_USER
              value: "ladder"
            - name: DB_PASSWORD
              value: "ladderpassword"
            - name: REDIS_HOST
              value: "redis"
            - name: REDIS_PORT
              value: "6379"
---
apiVersion: v1
kind: Service
metadata:
  name: elo-app
spec:
  selector:
    app: elo-app
  ports:
    - port: 8080
      targetPort: 8080
